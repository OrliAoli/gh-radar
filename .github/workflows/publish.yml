name: 每 3 天聚合发布

on:
  schedule:
    # 每 3 天的 UTC 00:40（北京 08:40）。比 daily.yml 晚 10 分钟，确保当天快照已入库
    - cron: '40 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 + 聚合
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch.py --no-alert
          # 先按真实反馈算出加权表，build 会读它来调权 / 过滤
          python scripts/feedback.py
          python scripts/build.py --days 3
          python scripts/readme.py

      - name: 生成中文简介（没配 Key 会自动跳过，字段保持为空）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/summarize.py

      - name: 打包静态站点
        run: python scripts/deploy.py --standalone

      - name: 推送本期通知（没配 VAPID 密钥会自动跳过）
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        # Web Push 需要 P-256/AES-GCM，标准库没有，只有这一步装依赖
        run: |
          pip install --quiet pywebpush
          python scripts/push.py --notify || true

      - name: 提交结果（data/ dist/ feed.xml）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ dist/ feed.xml
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore(auto): 发布榜单 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main || (git pull --rebase -X ours origin main && git push origin main)
          fi
