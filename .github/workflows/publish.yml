name: 每 3 天聚合发布

on:
  schedule:
    # 每 3 天的 UTC 00:40（北京 08:40）。比 daily.yml 晚 10 分钟，确保当天快照已入库
    - cron: '40 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 + 聚合 + 生成页面数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch.py --no-alert
          python scripts/build.py --days 3

      - name: 提交结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ feed.xml
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore(auto): 发布榜单 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main || (git pull --rebase -X ours origin main && git push origin main)
          fi
